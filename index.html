}

/* ---------- storage: native Preferences (or localStorage on the web) + optional Firebase sync ---------- */
{
  Store.init = async function(){
    this.mode=NATIVE?'native':'local';
    try{
      const {keys} = await Prefs.keys();
      const fresh = DEF();
      for(const key of keys){
        if(!(key==='settings'||key==='pmo'||key==='meta'||key.startsWith('m-'))) continue;
        const {value} = await Prefs.get({key}); if(!value) continue;
        let b; try{ b=JSON.parse(value); }catch(e){ continue; }
        if(key==='settings'){ if(b.settings) fresh.settings=deepMerge(fresh.settings,b.settings); if(Array.isArray(b.habits)) fresh.habits=b.habits; if(Array.isArray(b.timeline)) fresh.timeline=b.timeline; }
        else if(key==='pmo'){ fresh.pmo={start:b.start||fresh.pmo.start, resets:Array.isArray(b.resets)?b.resets:[]}; }
        else if(key==='meta'){ fresh.meta=b; }
        else if(b.days){ Object.assign(fresh.days, b.days); }
      }
      S=fresh; migrate();
      this.snap={}; Object.keys(S.days).forEach(k=>{ const {u,...rest}=S.days[k]||{}; this.snap[k]=JSON.stringify(rest); });
      this.fresh = !keys.includes('settings');

    }catch(e){ this.err='Could not read saved data on this device.'; }

    if(this.dirty.size) this.schedule();

  };
  Store.flush = async function(){
    if(this.busy){ this.schedule(); return; }
    this.busy=true;
    const ids=[...this.dirty]; this.dirty.clear();
    try{
      for(const id of ids){
        const ts=Date.now();
        if(id.startsWith('m-')){ const pre=id.slice(2); this.snap=this.snap||{}; Object.keys(S.days).forEach(k=>{ if(!k.startsWith(pre)) return; const d=S.days[k]; const {u,...rest}=d||{}; const sig=JSON.stringify(rest); if(this.snap[k]!==sig){ this.snap[k]=sig; d.u=ts; } }); }
        const body=this.body(id);
        S.meta=S.meta||{updated:{}}; S.meta.updated[id]= (this.fresh && id!=='m-'+todayKey().slice(0,7) && !(S.meta.updated[id]>1)) ? 1 : ts;
        try{ await Prefs.set({key:id, value:JSON.stringify(body)}); await Prefs.set({key:'meta', value:JSON.stringify(S.meta)}); this.err=null; }
        catch(e){ this.dirty.add(id); this.err='Some changes have not saved yet.'; }

  };
  const status0 = Store.status.bind(Store);
  Store.status = function(force){

const SyncLayer = {
  user:null, ready:false, pending:false, err:null,
  boot(){
    if(!window.Sync || !window.FIREBASE_CONFIG) return;
    try{ this.ready = Sync.init(window.FIREBASE_CONFIG); }catch(e){ this.err='Sync could not start: '+(e.message||e); return; }
    if(!this.ready) return;
    Sync.onAuth(u=>{ this.user=u; this.seeded=false; if(u) L.syncEmail=u.email, saveL(); Store.status(); });
    Sync.onRemote(async (docs, fromCache, allIds)=>{
      const first = !this.seeded && !fromCache; if(first) this.seeded=true;
      await this.applyRemote(docs);
      /* first server answer after sign-in: upload whatever this device has that the account doesn't yet */
      if(first){ const have=new Set(allIds||[]);
        const ids=['settings','pmo',...new Set(Object.keys(S.days).map(k=>'m-'+k.slice(0,7)))];
        for(const id of ids) if(!have.has(id)) await this.push(id, Store.body(id), (S.meta.updated&&S.meta.updated[id])||1); }
    });
  },
  async push(id, body, ts){ if(!this.ready||!this.user||!this.seeded) return; this.pending=true; Store.status(); try{ await Sync.push(id, body, ts); }catch(e){ this.err='Sync push failed'; } this.pending=false; Store.status(); },
  async pushAll(){ const ids=['settings','pmo',...new Set(Object.keys(S.days).map(k=>'m-'+k.slice(0,7)))]; for(const id of ids){ const ts=(S.meta&&S.meta.updated&&S.meta.updated[id])||1; await this.push(id, Store.body(id), ts); } },
  /* Days merge one by one (each day carries its own edit time `u`), so two devices never wipe each other's history.

  async applyRemote(docs){
    let changed=false, pushBack=new Set(); S.meta=S.meta||{updated:{}};
    for(const d of docs){
      const b=d.body; if(!b) continue;
      const mine=S.meta.updated[d.id]||0;
      if(d.id.startsWith('m-')){
        const rd=b.days||{}, pre=d.id.slice(2);
        for(const k of Object.keys(rd)){ const r=rd[k], l=S.days[k]; if(!l || (r.u||0) > (l.u||0)){ S.days[k]=r; const {u,...rest}=r; Store.snap=Store.snap||{}; Store.snap[k]=JSON.stringify(rest); changed=true; } else if((l.u||0) > (r.u||0)) pushBack.add(d.id); }
        Object.keys(S.days).forEach(k=>{ if(k.startsWith(pre) && !rd[k]) pushBack.add(d.id); });
        S.meta.updated[d.id]=Math.max(mine, d.updatedAt||0);
        try{ await Prefs.set({key:d.id, value:JSON.stringify(Store.body(d.id))}); }catch(e){}
      } else if(d.id==='pmo'){
        const resets=[...new Set([...(S.pmo.resets||[]), ...(b.resets||[])])].sort();
        const start = (d.updatedAt>mine) ? (b.start||S.pmo.start) : S.pmo.start;
        if(resets.length!==(S.pmo.resets||[]).length || start!==S.pmo.start){ S.pmo={start, resets}; changed=true; }
        if(resets.length!==(b.resets||[]).length || start!==b.start) pushBack.add('pmo');
        S.meta.updated.pmo=Math.max(mine, d.updatedAt||0);
        try{ await Prefs.set({key:'pmo', value:JSON.stringify(Store.body('pmo'))}); }catch(e){}
      } else if(d.id==='settings'){
        if(d.updatedAt>mine){ if(b.settings) S.settings=deepMerge(DEF().settings,b.settings); if(Array.isArray(b.habits)) S.habits=b.habits; if(Array.isArray(b.timeline)) S.timeline=b.timeline; migrate(); S.meta.updated.settings=d.updatedAt; changed=true; try{ await Prefs.set({key:'settings', value:JSON.stringify(Store.body('settings'))}); }catch(e){} }
        else if(mine>(d.updatedAt||0)) pushBack.add('settings');
      }
    }
    try{ await Prefs.set({key:'meta', value:JSON.stringify(S.meta)}); }catch(e){}
    for(const id of pushBack){ const ts=Math.max(Date.now(), (S.meta.updated[id]||0)); S.meta.updated[id]=ts; this.push(id, Store.body(id), ts); }
    if(changed){ ptCache.clear(); hjCache.clear(); render(true); scheduleAlarmSync(); }
  }
};

/* ---------- prayer times: mosque timetable (Mawaqit) or calculation ---------- */
function prayerTimes(k){
  if(S.settings.ptSource==='mosque'){
    const d=MosqueTimes.data();
    if(d && Array.isArray(d.calendar)){
      const [y,m,dd]=k.split('-').map(Number); const row=d.calendar[m-1]&&d.calendar[m-1][dd-1];
      if(row && row.length>=6){
        const t=row.map(parseHM); const iq=d.iqamaCalendar&&d.iqamaCalendar[m-1]&&d.iqamaCalendar[m-1][dd-1];
        return { fajr:t[0], sunrise:t[1], dhuhr:t[2], asr:t[3], maghrib:t[4], isha:t[5], mosque:true,
          iqama: iq&&iq.length>=5 ? {fajr:parseHM(iq[0]),dhuhr:parseHM(iq[1]),asr:parseHM(iq[2]),maghrib:parseHM(iq[3]),isha:parseHM(iq[4])} : null,
          jumua: dowK(k)===5 ? (d.jumua||null) : null };
      }
    }
  }
  return prayerTimesCalc(k);
}
const MOSQUE_SOURCES = {

    name:'Masjid Dar As-Salam, Charlottetown',
    widget:'https://mawaqit.net/en/w/dar-as-salam-mosque-charlottetown-c1e-2a1-canada',
    async fetch(){
      const res=await fetch(this.widget, {cache:'no-store', headers:{'Accept':'text/html'}});
      const html=await res.text();
      const m=html.match(/confData\s*=\s*(\{[\s\S]*?\});\s*\n/); if(!m) throw new Error('timetable not found in page');
      const c=JSON.parse(m[1]);

      const norm=cal=>cal.map(mo=>Object.keys(mo).map(Number).sort((a,b)=>a-b).map(d=>mo[d]));
      return { calendar:norm(c.calendar), iqamaCalendar:Array.isArray(c.iqamaCalendar)?norm(c.iqamaCalendar):null, jumua:c.jumua||null, jumua2:c.jumua2||null, hijriAdjustment:c.hijriAdjustment, fetched:todayKey() };

function momentAt(k, min){
  const pt=prayerTimes(k); if(!pt) return 'any';
  const scr=S.timeline.find(x=>x.id==='screens'), scrAt=scr?tlTime(scr,k):20*60+30;
  if(min<pt.fajr) return planQuick(k)?'suhoor':'night';
  if(min<pt.sunrise) return 'fajr';
  if(min<pt.dhuhr) return 'morning';
  if(min<pt.asr) return 'dhuhr';
  if(min<pt.maghrib) return 'asr';
  if(min<pt.isha) return planQuick(k)?'iftar':'maghrib';
  if(min<scrAt) return 'isha';
  return 'screens';
}
function reminderFor(k, moment){
  moment = moment || momentAt(k, k===todayKey()?nowMin():12*60);
  const w=dowK(k), tags=[moment];
  if(planQuick(k) && moment!=='suhoor' && moment!=='iftar') tags.push('fast');
  if(w===5) tags.push('friday'); if((w===1||w===4) && planQuick(k)) tags.push('monthu');
  const seed=diffDays('2026-01-01',k)*7 + ['night','suhoor','fajr','morning','dhuhr','asr','maghrib','iftar','isha','screens','any'].indexOf(moment);
  let pool=REM2.filter(r=>r.m.includes(moment));
  const dayPool=REM2.filter(r=>r.m.some(x=>tags.slice(1).includes(x)) && !r.m.includes(moment));
  if(dayPool.length && (seed%3===0 || !pool.length)) pool=dayPool;
  if(!pool.length) pool=REM2.filter(r=>r.m.includes('any'));
  const r=pool[((seed%pool.length)+pool.length)%pool.length];
  return [r.t, r.s];
}

function viewportProbe(){
  const cs=getComputedStyle(document.documentElement);
  const v=k=>(cs.getPropertyValue('--safe-area-inset-'+k)||'').trim()||'-';
  let env='';
  try{ const p=document.createElement('div'); p.style.cssText='position:fixed;left:-9999px;top:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)'; document.body.appendChild(p); const s=getComputedStyle(p); env=`env ${parseInt(s.paddingTop)}/${parseInt(s.paddingRight)}/${parseInt(s.paddingBottom)}/${parseInt(s.paddingLeft)}`; p.remove(); }catch(e){}
  const vv=window.visualViewport;
  return `viewport ${innerWidth}×${innerHeight} dpr ${devicePixelRatio} screen ${screen.width}×${screen.height}${vv?` visual ${Math.round(vv.width)}×${Math.round(vv.height)}`:''} · vars ${v('top')}/${v('right')}/${v('bottom')}/${v('left')} · ${env}`;
}

const Q = { data:null, loading:null, err:null };
function quranLoad(){
  if(Q.data || Q.loading) return Q.loading;
  Q.loading = fetch('quran-juz29-30.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ Q.data=d; if(U.view==='quran') render(true); }).catch(e=>{ Q.err=String(e.message||e); Q.loading=null; if(U.view==='quran') render(true); });

}

/* 11 rak'ahs (the Sunnah count of the night prayer with witr): the two juz split into 11 parts of near-equal recitation length (counted in letters), cut only between ayahs */
const rakahN = () => (S.settings.tahajjud && S.settings.tahajjud.rk===13) ? 13 : 11;
function rakahParts(){
  const RAKAHS=rakahN();
  if(Q.parts && Q.parts.length===RAKAHS) return Q.parts;
  const flat=[]; Q.data.surahs.forEach(s=>s.v.forEach((v,i)=>flat.push({s:s.n,a:i+1,len:v[0].replace(/[^\u0621-\u064A\u0671-\u06D3]/g,'').length})));
  const total=flat.reduce((x,y)=>x+y.len,0), N=RAKAHS, parts=[]; let acc=0, start=0;
  for(let r=1;r<=N;r++){
    let end;
    if(r===N) end=flat.length-1;
    else { const target=total*r/N; end=start; acc+=flat[end].len; while(end<flat.length-1 && acc<target){ end++; acc+=flat[end].len; }
      if(end>start && (acc-target) > (target-(acc-flat[end].len))){ acc-=flat[end].len; end--; } }
    const seg=flat.slice(start,end+1); parts.push({r, from:seg[0], to:seg[seg.length-1], ayahs:seg.length, len:seg.reduce((x,y)=>x+y.len,0)}); start=end+1;
  }
  Q.parts=parts; Q.rakahStart={}; parts.forEach(p=>{ Q.rakahStart[p.from.s+':'+p.from.a]=p.r; });
  return parts;
}
function surahOf(n){ return Q.data && Q.data.surahs.find(s=>s.n===n); }

/* ============================== reminders ============================== */
let userInteracted=false; const fired=new Set();
function chime(){ if(!S.settings.rem.chime||!userInteracted) return; try{ const C=new (window.AudioContext||window.webkitAudioContext)(); const o=C.createOscillator(), g=C.createGain(); o.type='sine'; o.frequency.value=660; g.gain.setValueAtTime(.0001,C.currentTime); g.gain.exponentialRampToValueAtTime(.12,C.currentTime+.05); g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+1.2); o.connect(g).connect(C.destination); o.start(); o.stop(C.currentTime+1.3); }catch(e){} }
function notify(title, body){
  toast(title, body); chime();
  try{ if(S.settings.rem.notify && 'Notification' in window && Notification.permission==='granted') new Notification(title,{body}); }catch(e){}
}
function remindTick(){
  if(NATIVE) return;
  const r=S.settings.rem; if(!r.on || !U.loaded) return;
  const k=todayKey(), now=nowMin(), pt=prayerTimes(k), f=planQuick(k), ev=[];
  if(pt && r.prayers) PRAYERS.forEach(([id,n])=>ev.push({id:'p-'+id, at:pt[id]-(+r.lead||0), t:`${n} ${r.lead?`in ${r.lead} min`:'now'}`, b:`At ${fmtMin(pt[id])}`}));
  if(pt && f && r.suhoor) ev.push({id:'suhoor', at:pt.fajr-45, t:'Suhoor', b:`Fajr at ${fmtMin(pt.fajr)}. Eat and drink now.`});
  if(pt && f && r.iftar) ev.push({id:'iftar', at:pt.maghrib, t:'Time for iftar', b:'Dates and water, then pray Maghrib.'});
  if(r.prep && planQuick(addDays(k,1))) ev.push({id:'prep', at:20*60+45, t:'Tomorrow is a fast', b:'Fill a water bottle, set your suhoor alarm, pack dates.'});
  if(r.habits){ const s=dayScore(k); if(s.total && s.done<s.total) ev.push({id:'habits', at:21*60, t:'Checklist still open', b:`${s.total-s.done} left today.`}); }
  if(r.bed){ const sl=S.timeline.find(x=>x.id==='sleep'); if(sl) ev.push({id:'bed', at:tlTime(sl,k), t:'Lights out', b:'Screens down. Sleep protects tomorrow’s Fajr.'}); }
  timelineFor(k).filter(it=>it.remind && !it.prayer).forEach(it=>ev.push({id:'t-'+it.id, at:it.at, t:it.label, b:it.note||''}));
  ev.forEach(e=>{ const key=k+'|'+e.id; if(!fired.has(key) && now>=e.at && now<e.at+3){ fired.add(key); notify(e.t, e.b); } });
}
setInterval(()=>{ remindTick(); if(['today','routine'].includes(U.view) && !document.querySelector('.edit-panel') && document.activeElement?.tagName!=='INPUT' && document.activeElement?.tagName!=='SELECT') render(true); }, 60000);

/* ============================== boot ============================== */
setInterval(liveTick, 1000);
(async function boot(){
  route();
  await Store.init();
  U.loaded=true;
  document.getElementById('loading').remove();
  ptCache.clear(); hjCache.clear();
  route();
  remindTick();
  window.dispatchEvent(new Event('dos-ready'));
})();

</script>
