<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Discipline OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one editorial column under a floating glass nav; each section has its own shape (masthead, sky arc, ribbon, ledger, columns), never a grid of identical cards. Prayer times are the spine of every day. */
:root{
  --bg:#0a0e13; --bg-2:#0e141a; --bg-3:#121a21;
  --ink:#e9eeec; --ink-2:#a9b7b2; --ink-3:#6f7f7a; --ink-4:#424f4b;
  --line:rgba(169,183,178,.1); --line-2:rgba(169,183,178,.2);
  --surface:rgba(255,255,255,.028); --surface-2:rgba(255,255,255,.05); --glass:rgba(12,17,22,.72);
  --accent:#58b79e; --accent-2:#8fd9c4; --accent-soft:rgba(88,183,158,.14); --accent-ink:#06211b;
  --gold:#d5b46a; --gold-2:#ecd49a; --gold-soft:rgba(213,180,106,.14); --gold-ink:#2a2008;
  --rose:#d2807d; --rose-soft:rgba(210,128,125,.14);
  --sky-top:rgba(88,183,158,.16); --sky-gold:rgba(213,180,106,.12);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 30px 60px -40px rgba(0,0,0,.9);
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f4; --bg-2:#eaeeec; --bg-3:#e2e8e5;
  --ink:#152420; --ink-2:#4b5d57; --ink-3:#7d8e88; --ink-4:#b4c0bb;
  --line:rgba(21,36,32,.09); --line-2:rgba(21,36,32,.18);
  --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.85); --glass:rgba(243,245,244,.8);
  --accent:#227a66; --accent-2:#185c4d; --accent-soft:rgba(34,122,102,.12); --accent-ink:#ffffff;
  --gold:#a3802c; --gold-2:#7f621c; --gold-soft:rgba(163,128,44,.14); --gold-ink:#fff;
  --rose:#b1504c; --rose-soft:rgba(177,80,76,.12);
  --sky-top:rgba(34,122,102,.12); --sky-gold:rgba(163,128,44,.1);
  --shadow:0 1px 2px rgba(20,40,35,.05), 0 24px 50px -36px rgba(20,40,35,.35);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f5f4; --bg-2:#eaeeec; --bg-3:#e2e8e5;
  --ink:#152420; --ink-2:#4b5d57; --ink-3:#7d8e88; --ink-4:#b4c0bb;
  --line:rgba(21,36,32,.09); --line-2:rgba(21,36,32,.18);
  --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.85); --glass:rgba(243,245,244,.8);
  --accent:#227a66; --accent-2:#185c4d; --accent-soft:rgba(34,122,102,.12); --accent-ink:#ffffff;
  --gold:#a3802c; --gold-2:#7f621c; --gold-soft:rgba(163,128,44,.14); --gold-ink:#fff;
  --rose:#b1504c; --rose-soft:rgba(177,80,76,.12);
  --sky-top:rgba(34,122,102,.12); --sky-gold:rgba(163,128,44,.1);
  --shadow:0 1px 2px rgba(20,40,35,.05), 0 24px 50px -36px rgba(20,40,35,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent-soft)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;line-height:1.02;text-wrap:balance}
h1,h2,h3{margin:0;font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.eyebrow.gold{color:var(--gold)} .eyebrow.acc{color:var(--accent)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.prose p{margin:0 0 10px;max-width:66ch}.prose p:last-child{margin:0}
.prose ul{margin:4px 0 10px;padding-left:18px;max-width:66ch}.prose li{margin:4px 0;color:var(--ink-2)}
.prose b{color:var(--ink);font-weight:600}
/* ------------ background ------------ */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.bgfx::before{content:"";position:absolute;inset:-10% -10% auto;height:70vh;background:
  radial-gradient(60% 55% at 50% 0%, var(--sky-top), transparent 70%),
  radial-gradient(35% 40% at 85% 10%, var(--sky-gold), transparent 70%)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:var(--girih);background-size:140px 140px;opacity:.055;
  mask-image:radial-gradient(70% 60% at 50% 0%, #000 10%, transparent 100%);-webkit-mask-image:radial-gradient(70% 60% at 50% 0%, #000 10%, transparent 100%)}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:var(--noise);background-size:220px 220px;mix-blend-mode:overlay}
/* ------------ top nav ------------ */
.top{position:sticky;top:var(--safe-area-inset-top,0px);z-index:30;padding-block:14px 8px;padding-left:max(16px,var(--safe-area-inset-left,0px));padding-right:max(16px,var(--safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.wordmark{font-family:var(--f-display);font-size:22px;font-weight:500;text-decoration:none;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:9px}
.wordmark svg{width:22px;height:22px;color:var(--gold)}
.wordmark em{font-style:italic;color:var(--ink-2);font-weight:400}
.pillnav{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--shadow);justify-self:center}
.pillnav a{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:600;letter-spacing:.01em;transition:background .18s,color .18s;white-space:nowrap}
.pillnav a svg{width:16px;height:16px;opacity:.8}
.pillnav a:hover{color:var(--ink);background:var(--surface-2)}
.pillnav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.pillnav a[aria-current="page"] svg{color:var(--accent);opacity:1}
.top-right{justify-self:end;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-4);flex:none}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--gold)} .dot.local{background:var(--ink-3)}
.sync-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tabbar{display:none}
/* ------------ page ------------ */
main{padding-block:14px 90px;padding-left:max(16px,var(--safe-area-inset-left,0px));padding-right:max(16px,var(--safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:56px;animation:view-in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes view-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.still .cres,.still .dial line{animation:none}
@media (prefers-reduced-motion:reduce){.view,.rise,.seal svg,.seal::after,.just,.dial line,.pray-mark,.cres{animation:none!important;transition:none!important}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-family:var(--f-display);font-size:34px;font-weight:500;letter-spacing:-.015em;line-height:1}
.sec-head .eyebrow{margin-bottom:8px}
.sec-head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.link:hover{border-color:var(--accent)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.rule.orn{position:relative;overflow:visible;border-color:var(--line-2)}
.rule.orn::after{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
/* ------------ masthead ------------ */
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding-top:28px}
.mast h1{font-size:clamp(40px,6vw,66px)}
.mast h1 em{font-style:italic;font-weight:400;color:var(--ink-2)}
.dateline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--ink-2);font-size:14px}
.dateline .hj{font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--gold-2);letter-spacing:0}
.dateline .sep{width:22px;height:1px;background:var(--line-2)}
.statusline{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.tag svg{width:13px;height:13px}
.tag.gold{color:var(--gold-2);border-color:transparent;background:var(--gold-soft)}
.tag.acc{color:var(--accent-2);border-color:transparent;background:var(--accent-soft)}
.tag.rose{color:var(--rose);border-color:transparent;background:var(--rose-soft)}
.dial{position:relative;flex:none}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial line{stroke:var(--line-2);stroke-width:1.6;stroke-linecap:round}
.dial line.on{stroke:var(--accent);animation:tick-in .5s both;animation-delay:var(--d)}
@keyframes tick-in{from{stroke:var(--line-2)}to{stroke:var(--accent)}}
.dial .dial-ring{fill:none;stroke:var(--line);stroke-width:1}
.dial-lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial-lbl b{font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.03em}
.dial-lbl b i{font-style:normal;font-size:20px;color:var(--ink-3);margin-left:1px}
.dial-lbl span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;font-weight:600}
.dial.complete line.on{stroke:var(--gold)}
.dial.complete .dial-lbl b{color:var(--gold-2)}
/* ------------ sky arc ------------ */
.sky{position:relative}
.sky-svg{width:100%;height:auto;display:block;overflow:visible}
.sky-svg text{font-family:var(--f-body);font-size:11.5px;font-weight:600;fill:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.sky-svg .horizon{stroke:var(--line-2);stroke-width:1}
.sky-svg .base{fill:none;stroke:var(--line-2);stroke-width:1.2}
.sky-svg .fastwin{fill:none;stroke:var(--gold);stroke-width:7;stroke-opacity:.28;stroke-linecap:round}
.sky-svg .fastdone{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-opacity:.95}
.sky-svg .daydone{fill:none;stroke:var(--accent);stroke-width:2;stroke-opacity:.9;stroke-linecap:round}
.sky-svg .node{cursor:pointer}
.sky-svg .node circle.o{fill:var(--bg);stroke:var(--ink-3);stroke-width:1.5;transition:all .25s}
.sky-svg .node.on circle.o{fill:var(--accent);stroke:var(--accent)}
.sky-svg .node.on text{fill:var(--accent-2)}
.sky-svg .node.next circle.o{stroke:var(--gold)}
.sky-svg .node.next circle.halo{fill:none;stroke:var(--gold);stroke-width:1;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{r:7;opacity:.9}100%{r:20;opacity:0}}
@keyframes halo-lg{0%{r:11;opacity:.9}100%{r:30;opacity:0}}
.sky-svg .node:hover circle.o{stroke:var(--accent-2)}
.sky-svg .node.just circle.o{animation:node-pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes node-pop{50%{r:9}}
.sky-svg .sun{fill:var(--gold-2);filter:url(#sunglow)}
.sky-svg .moon{fill:var(--ink-2);opacity:.8}
.sky-svg .nowdot{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.sky-svg .nowlbl{fill:var(--ink-2);text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:500}
.sky-svg .sunrise{stroke:var(--gold);stroke-width:1.2;opacity:.7}
.countdown{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);text-align:center;width:min(360px,80%);pointer-events:none}
.countdown .cd-l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.countdown .cd-n{font-family:var(--f-display);font-size:clamp(44px,7vw,74px);font-weight:500;line-height:1;letter-spacing:-.03em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.countdown.gold .cd-n{color:var(--gold-2)}
.countdown .cd-s{font-size:13px;color:var(--ink-2)}
.countdown .cd-act{pointer-events:auto;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);margin-top:-6px}
.pray{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px 14px;border-right:1px solid var(--line);position:relative;transition:background .2s;text-align:center}
.pray:last-child{border-right:0}
.pray:hover{background:var(--surface)}
.pray-ar{font-family:var(--f-ar);font-size:18px;color:var(--ink-3);line-height:1}
.pray-n{font-weight:600;font-size:14px;letter-spacing:.01em}
.pray-t{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.pray-mark{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:6px;transition:all .25s}
.pray.on .pray-mark{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pray.on .pray-n{color:var(--accent-2)}
.pray.next::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:2px;background:var(--gold);border-radius:2px}
.pray.just .pray-mark{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{50%{transform:scale(1.5)}}
.pstrip-done{text-align:center;font-family:var(--f-display);font-style:italic;font-size:19px;color:var(--gold-2);padding:14px 0 0}
/* ------------ fasting ribbon ------------ */
.ribbon{position:relative;overflow:hidden;border-radius:22px;padding:30px 34px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:center;border:1px solid var(--line);background:linear-gradient(120deg,var(--accent-soft),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.ribbon.is-fast{background:linear-gradient(120deg,var(--gold-soft),transparent 60%),var(--surface)}
.ribbon::before{content:"";position:absolute;inset:0;background-image:var(--girih);background-size:120px 120px;opacity:.06;pointer-events:none;mask-image:linear-gradient(90deg,transparent 40%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000)}
.ribbon .cres-big{position:absolute;right:-30px;top:-40px;width:220px;height:220px;color:var(--gold);opacity:.1;pointer-events:none}
.ribbon.is-fast .cres-big{opacity:.18}
.ribbon > *{position:relative}
.ribbon h2{font-family:var(--f-display);font-size:38px;line-height:1;letter-spacing:-.015em;margin:6px 0 8px}
.ribbon .why{color:var(--ink-2);font-size:14.5px;max-width:52ch}
.ribbon .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rb-side{display:flex;flex-direction:column;gap:16px}
.streak{display:flex;align-items:center;gap:14px}
.streak b{font-family:var(--f-display);font-size:40px;font-weight:500;line-height:1}
.cres-row{display:flex;gap:4px;flex-wrap:wrap}
.cres{width:14px;height:14px;color:var(--gold);animation:cres-in .5s both;animation-delay:var(--d)}
.cres.off{color:var(--ink-4)}
@keyframes cres-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nextfasts{display:flex;gap:6px;flex-wrap:wrap}
.nf{text-decoration:none;display:inline-flex;flex-direction:column;align-items:center;padding:7px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:50px}
.nf .d{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nf .n{font-family:var(--f-display);font-size:22px;line-height:1;margin-top:2px}
.nf .m{font-size:10px;color:var(--ink-3)}
.nf.ram{border-color:var(--gold)}
/* ------------ ledger + week ------------ */
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:44px;align-items:start}
.ledger{min-width:0}
.lg-group{margin-top:18px}
.lg-group:first-child{margin-top:0}
.lg-title{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px;border-bottom:1px solid var(--line-2)}
.lg-title .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.lg-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);transition:background .2s;border-radius:4px}
.lg-item:hover{background:var(--surface)}
.lg-item .nm{font-size:15.5px;font-weight:500;transition:color .25s}
.lg-item.on .nm{color:var(--ink-3)}
.lg-item .st{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.lg-item.on .st{color:var(--accent)}
.lg-item.just{animation:pop-row .4s}
@keyframes pop-row{50%{background:var(--accent-soft)}}
.seal{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;position:relative;transition:all .25s;color:var(--accent-ink)}
.seal svg{width:13px;height:13px;opacity:0;transform:scale(.3) rotate(-60deg);transition:all .35s cubic-bezier(.2,1.5,.4,1)}
.on .seal{background:var(--accent);border-color:var(--accent)}
.on .seal svg{opacity:1;transform:none}
.just .seal::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--accent);animation:ripple .75s ease-out forwards}
@keyframes ripple{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(2.1)}}
.complete-orn{margin-top:22px;text-align:center;font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--gold-2);padding:18px 0 0;border-top:1px solid var(--line-2);position:relative}
.complete-orn::before{content:"";position:absolute;left:50%;top:-6px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3);font-size:14px;border:1px dashed var(--line-2);border-radius:14px}
.empty b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.wcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.wcol{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 2px 12px;border-right:1px solid var(--line);position:relative;text-decoration:none;color:inherit}
.wcol:last-child{border-right:0}
.wcol .wd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.wcol .wn{font-family:var(--f-display);font-size:24px;line-height:1}
.wcol.today .wn{color:var(--gold-2)}
.wcol.today::after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:2px;background:var(--gold)}
.wstack{display:flex;flex-direction:column;gap:3px}
.wstack i{width:14px;height:5px;border-radius:3px;background:var(--line-2)}
.wstack i.on{background:var(--accent)}
.wmoon{width:18px;height:18px;color:var(--ink-4)}
.wmoon.plan{color:var(--gold)} .wmoon.kept{color:var(--accent)} .wmoon.miss{color:var(--rose)} .wmoon.no{color:var(--rose);opacity:.5}
.wmoon.plan svg{fill:none;stroke:currentColor;stroke-width:1.6}
.wlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-3)}
.wlegend span{display:inline-flex;align-items:center;gap:6px}
.wlegend .wmoon{width:13px;height:13px}
/* ------------ whisper + quote ------------ */
.whisper{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:44px;align-items:start;padding-top:8px}
.whisper .big{font-family:var(--f-display);font-size:60px;line-height:1;font-weight:500}
.whisper .big i{font-style:italic;font-size:20px;color:var(--ink-3);margin-left:6px;font-weight:400}
.veil{filter:blur(10px);user-select:none;transition:filter .35s}
.quote{font-family:var(--f-display);font-size:clamp(24px,2.6vw,32px);line-height:1.3;font-weight:400;letter-spacing:-.005em;max-width:30ch}
.quote::before{content:"";display:block;width:44px;height:1px;background:var(--gold);margin-bottom:18px}
.quote small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:14px;font-weight:600}
/* ------------ buttons / controls ------------ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;transition:all .18s;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--rose);border-color:var(--rose-soft)}
.btn.danger.solid{background:var(--rose);color:#fff;border-color:var(--rose)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn svg{width:14px;height:14px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);transition:all .18s}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn svg{width:16px;height:16px}
.icon-btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap;gap:2px}
.seg button{padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--ink-2);font-weight:600;transition:all .18s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-date{font-family:var(--f-display);font-size:19px;padding:4px 10px;min-width:120px;text-align:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;min-width:0}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-width:0;width:100%;font-weight:500;letter-spacing:0;text-transform:none;font-size:14px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:130px;font-family:var(--f-mono);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .tx{min-width:0;font-weight:500}
.toggle .tx small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400;margin-top:1px}
.sw{position:relative;width:40px;height:23px;flex:none;border-radius:999px;background:var(--line-2);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(17px);background:var(--accent-ink)}
.panel{border:1px solid var(--line);border-radius:18px;padding:22px 24px;background:var(--surface);box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-display);font-size:24px;font-weight:500;letter-spacing:-.01em}
.panel .eyebrow{margin-bottom:6px}
.edit-panel{border:1px solid var(--line-2);border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px;margin:8px 0 12px}
.dayp{display:flex;gap:6px;flex-wrap:wrap}
.dayp button{width:36px;height:32px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:600}
.dayp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{border-radius:14px;padding:14px 16px;background:var(--accent-soft);font-size:14px}
.note.warn{background:var(--gold-soft)} .note.rose{background:var(--rose-soft)}
/* ------------ stats ------------ */
.bigstats{display:flex;flex-wrap:wrap;gap:0}
.bigstat{padding:6px 28px 6px 0;margin-right:28px;border-right:1px solid var(--line-2)}
.bigstat:last-child{border-right:0;margin-right:0}
.bigstat b{display:block;font-family:var(--f-display);font-size:46px;font-weight:500;line-height:1;letter-spacing:-.02em}
.bigstat b small{font-size:22px;color:var(--ink-3);font-weight:400}
.bigstat span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:8px}
.bigstat.gold b{color:var(--gold-2)}
/* ------------ fasting calendar ------------ */
.calhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.calhead h2{font-family:var(--f-display);font-size:clamp(40px,5vw,60px);line-height:1;letter-spacing:-.02em}
.calhead .hjm{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--gold-2);margin-top:6px}
.callayout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:40px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.cal .dh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:center;padding:0 0 10px;border-bottom:1px solid var(--line-2)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border-radius:12px;transition:background .18s}
.day:hover{background:var(--surface)}
.day.blank{visibility:hidden}
.day-ring{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:500;line-height:1;transition:all .2s;color:var(--ink)}
.day-hj{font-size:10.5px;color:var(--ink-3);font-family:var(--f-mono)}
.day.fast .day-ring{box-shadow:0 0 0 1.5px var(--gold) inset;color:var(--gold-2)}
.day.unlogged .day-ring{box-shadow:0 0 0 1.5px var(--gold) inset;color:var(--ink-3);opacity:.75}
.day.kept .day-ring{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.day.extra .day-ring{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent) inset;color:var(--accent-2)}
.day.missed .day-ring{outline:1.5px dashed var(--rose);outline-offset:-1.5px;color:var(--rose);box-shadow:none}
.day.excused .day-ring{box-shadow:0 0 0 1.5px var(--line-2) inset;color:var(--ink-3)}
.day.oblig .day-ring{background:var(--gold-soft);box-shadow:0 0 0 1.5px var(--gold) inset;color:var(--gold-2)}
.day.oblig.kept .day-ring{background:var(--gold);color:var(--gold-ink)}
.day.prohib .day-ring{background:repeating-linear-gradient(135deg,var(--rose-soft) 0 3px,transparent 3px 7px);color:var(--rose)}
.day.skip .day-ring{outline:1px dotted var(--ink-3);outline-offset:-1px;color:var(--ink-3)}
.day.rest .day-ring{color:var(--ink-2)}
.day.today .day-ring::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--accent);opacity:.7}
.day.sel .day-ring::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--ink)}
.day .adj{position:absolute;top:-2px;right:-2px;width:8px;height:8px;transform:rotate(45deg);background:var(--gold);border:1.5px solid var(--bg)}
.day .dm{position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;color:var(--gold);background:var(--bg);border-radius:50%;padding:1.5px}
.day.kept .dm{color:var(--accent)}
.day.fri .day-hj::after{content:"·J";color:var(--ink-4)}
.legend{display:flex;gap:14px 20px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:18px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.calside{display:flex;flex-direction:column;gap:26px;position:sticky;top:90px}
.sheet{animation:sheet .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.minilist{display:flex;flex-direction:column}
.minirow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.minirow:first-child{border-top:0}
.minirow .t{font-weight:600}.minirow .s{font-size:12.5px;color:var(--ink-3);font-family:var(--f-display);font-style:italic;font-size:14px}
.minirow .d{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rules{margin-top:8px}
/* ------------ habits page ------------ */
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.hrow .nm{font-size:17px;font-weight:500;font-family:var(--f-display);font-size:22px}
.hrow .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rate{display:flex;flex-direction:column;gap:6px}
.rate .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.rate .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rate .v{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.spark{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;margin-top:8px}
.spark i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.spark i.on{background:var(--accent)}
.spark i.na{background:transparent;border:1px dashed var(--line)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:6px}
.hm i{width:13px;height:13px;border-radius:4px;background:var(--line)}
.hm i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.hm i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.hm i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.hm i[data-l="4"]{background:var(--accent)}
.hm i.fut{background:transparent}
.hm i.reset{background:var(--rose)}
/* ------------ restraint ------------ */
.rs-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center}
.rs-dial{position:relative;width:260px;height:260px}
.rs-dial svg{width:100%;height:100%;overflow:visible}
.rs-dial line{stroke:var(--line-2);stroke-width:2;stroke-linecap:round}
.rs-dial line.on{stroke:var(--accent)} .rs-dial line.reset{stroke:var(--rose)} .rs-dial line.fut{stroke:var(--line)}
.rs-dial .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rs-dial .lbl b{font-family:var(--f-display);font-size:92px;font-weight:500;line-height:1;letter-spacing:-.04em}
.rs-dial .lbl span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:4px}
.stations{position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin-top:10px;padding-top:14px}
.stations::before{content:"";position:absolute;left:8px;right:8px;top:21px;height:1px;background:var(--line-2)}
.station{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.station i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg);display:block}
.station.got i{background:var(--gold);border-color:var(--gold)}
.station.next i{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 8px var(--gold-soft)}}
.station span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.station.got span{color:var(--gold-2)}
/* ------------ nutrition ------------ */
.courses{display:flex;flex-direction:column}
.course{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 22px;padding:20px 0;border-top:1px solid var(--line)}
.course:first-child{border-top:0;padding-top:0}
.course .when{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--gold-2);padding-top:2px}
.course .what{font-weight:600;font-size:16px}
.course ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.course li{margin:3px 0}
.nut-aside{display:flex;flex-direction:column;gap:26px}
.nut-aside .eyebrow{margin-bottom:8px}
/* ------------ routine ------------ */
.tl{position:relative;display:flex;flex-direction:column;padding:6px 0}
.tl::before{content:"";position:absolute;left:92px;top:0;bottom:0;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--accent) 0%,var(--gold) 35%,var(--gold) 60%,var(--rose) 78%,var(--ink-4) 100%);opacity:.55}
.ti{display:grid;grid-template-columns:76px 34px minmax(0,1fr) auto;gap:0 10px;align-items:start;padding:11px 0}
.ti .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);text-align:right;padding-top:3px}
.ti .nd{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink-3);background:var(--bg);margin:6px auto 0;position:relative;z-index:1}
.ti.prayer .nd{width:15px;height:15px;border:0;background:var(--gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);margin-top:4px}
.ti.past{opacity:.45}
.ti.now .nd{box-shadow:0 0 0 6px var(--accent-soft);border-color:var(--accent)}
.ti .tt{font-weight:600;font-size:15px}
.ti.prayer .tt{font-family:var(--f-display);font-size:20px;font-weight:500}
.ti .ts{font-size:12.5px;color:var(--ink-3)}
.nowline{display:grid;grid-template-columns:76px 34px minmax(0,1fr);gap:0 10px;align-items:center;padding:4px 0}
.nowline .tm{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-align:right}
.nowline .ln{height:1px;background:var(--accent);grid-column:2/4;position:relative}
.nowline .ln::before{content:"";position:absolute;left:12px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
/* ------------ charts ------------ */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{stroke:none}
.chart .bp{fill:var(--line-2)} .chart .ba{fill:var(--accent)} .chart .bg{fill:var(--gold)}
.chart .pt{fill:var(--accent);stroke:var(--bg);stroke-width:2.5}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px 22px;font-size:14px;align-items:center}
.cmp .h{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.delta.up{color:var(--accent-2)} .delta.dn{color:var(--rose)}
.ins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
.ins-grid h3{font-family:var(--f-display);font-size:24px;font-weight:500;margin-bottom:10px}
.tbl{overflow-x:auto}
/* ------------ prefs ------------ */
.pref{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:30px 0;border-top:1px solid var(--line-2)}
.pref:first-of-type{border-top:0;padding-top:0}
.pref h3{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.01em;margin-top:6px}
.pref .desc{font-size:13.5px;color:var(--ink-3);margin-top:6px;max-width:30ch}
/* ------------ toasts ------------ */
.toasts{position:fixed;right:max(16px,calc(var(--safe-area-inset-right,0px) + 16px));bottom:calc(var(--safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:14px;padding:12px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.7);font-size:14px;animation:view-in .3s ease both;display:flex;gap:10px;align-items:flex-start}
.toast b{display:block;font-weight:600}
.toast svg{width:16px;height:16px;color:var(--gold);flex:none;margin-top:2px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;font-family:var(--f-display);font-size:22px;color:var(--ink-2);background:var(--bg)}
/* ------------ responsive ------------ */
@media (max-width:1000px){
  .two,.whisper,.callayout,.ins-grid{grid-template-columns:minmax(0,1fr)}
  .pref{grid-template-columns:minmax(0,1fr);gap:14px;padding:24px 0}
  .calside{position:static}
  .rs-hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:28px}
}
@media (max-width:820px){
  .top{padding-block:10px 6px}
  .top-in{grid-template-columns:1fr auto}
  .pillnav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:2px;padding:6px max(8px,var(--safe-area-inset-left,0px)) calc(8px + var(--safe-area-inset-bottom,0px)) max(8px,var(--safe-area-inset-right,0px));background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabbar a{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;text-decoration:none;color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:.04em}
  .tabbar a svg{width:19px;height:19px}
  .tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  main{padding-block:8px 120px}
  .view{gap:40px}
  .mast{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:12px}
  .mast .dial{justify-self:start}
  .ribbon{grid-template-columns:minmax(0,1fr);padding:24px 22px;border-radius:18px}
  .ribbon h2{font-size:32px}
  .countdown{position:static;transform:none;width:100%;margin:4px auto 18px}
  .countdown .cd-n{font-size:clamp(40px,12vw,60px)}
  .sky-svg text{font-size:19px}
  .sky-svg .node circle.o{r:10;stroke-width:2.5}
  .sky-svg .node.next circle.halo{animation:halo-lg 2.4s ease-out infinite}
  .sky-svg .nowdot{r:7}.sky-svg .sun{r:14}
  .sky-svg .base{stroke-width:2}.sky-svg .fastwin,.sky-svg .fastdone{stroke-width:11}.sky-svg .daydone{stroke-width:3.5}
  .sky-svg .nowlbl{font-size:16px}
  .sec-head h2{font-size:28px}
  .hrow{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .hrow .rate{grid-column:1/-1}
  .bigstat{padding-right:18px;margin-right:18px}
  .bigstat b{font-size:36px}

/* ============================== the observatory skin ==============================
   One memorable thing: the living sky. Everything else is quiet brass-and-ink instrument plates.
   Phones read it as a vertical column of plates; tablets as one instrument panel behind a rail. */

/* captions: italic serif, sentence case — engraving, not shouting */
.eyebrow{font-family:var(--f-display);font-style:italic;font-size:15.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-3)}
.lg-title .eyebrow{font-size:16px}
.countdown .cd-l,.quote small,.dial-lbl span,.wcol .wd,.board-rem small,.board-foot{font-family:var(--f-display);font-style:italic;font-size:14px;letter-spacing:0;text-transform:none;font-weight:500}
.quote small{font-size:14.5px;margin-top:10px}
.wcol .wd{font-size:13px}
.board-foot{font-size:15px}
.board-rem small{font-size:15px}
.grain{opacity:.035;mix-blend-mode:normal}

/* the sky plate */
.skybox{position:relative;isolation:isolate}
.skybox canvas.sky-live{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:22px;z-index:0}
.skybox canvas.dome-only{border-radius:0;inset:-45% -30%;width:160%;height:190%;pointer-events:none}
.board .skybox{overflow:visible}
body.in-board::before{display:none}
.skybox .sky-svg{position:relative;z-index:1;shape-rendering:geometricPrecision}
.sky-svg .moon{display:none}
.sky-svg .nowdot{fill:var(--gold-2);stroke:transparent}
.sky-svg text{fill:rgba(233,238,236,.62);font-size:11px;letter-spacing:.1em}
.sky-svg .horizon{stroke:rgba(236,212,154,.35)}
.sky-svg .base{stroke:rgba(233,238,236,.28)}
.sky-svg .node circle.o{fill:rgba(10,14,19,.75);stroke:rgba(236,212,154,.75)}
.sky-svg .node.on circle.o{fill:var(--accent);stroke:var(--accent-2)}
.sky-svg .node.on text{fill:var(--accent-2)}
.sky-svg .node.next circle.o{stroke:var(--gold-2);stroke-width:2}
.sky-svg .node.next text{fill:var(--gold-2)}
.sky-svg .sun{fill:#fff3cf}
.sky-svg .sunrise{stroke:rgba(236,212,154,.8)}

/* the side plate: countdown and the moon */
.today-side{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 24px;align-items:center;padding:22px 24px;border:1px solid var(--line-2);border-radius:22px;background:linear-gradient(160deg,var(--surface-2),transparent 70%),var(--surface);position:relative;overflow:hidden}

.today-side .countdown{position:static;transform:none;text-align:left;width:auto;pointer-events:auto;margin:0}
.today-side .countdown .cd-n{font-size:clamp(44px,8vw,78px);margin:2px 0 4px}
.today-side .countdown .cd-act{justify-content:flex-start}
.moon-plate{display:grid;grid-template-columns:auto;justify-items:center;text-align:center;gap:8px;position:relative;z-index:1}

/* ============================== fasting engine ============================== */
/* Classification is a fixed property of the date (Hijri rules). The plan layers the alternating
   pattern, Friday/Saturday preferences and manual overrides on top. The pattern is pure parity from the
   anchor date, so adjusting or skipping a day never shifts or resets the cycle. */
function classify(k){
  const h=hijri(k), w=dowK(k), f=S.settings.fasting, notes=[];
  if(h.m===10 && h.d===1) return {cls:'prohibited', reason:'Eid al-Fitr', notes};
  if(h.m===12 && h.d===10) return {cls:'prohibited', reason:'Eid al-Adha', notes};
  if(h.m===12 && h.d>=11 && h.d<=13) return {cls:'prohibited', reason:'Day of Tashreeq', notes};
  if(h.m===9) return {cls:'obligatory', reason:'Ramadan', notes};
  if(h.m===12 && h.d===9) notes.push('Day of Arafah: strongly recommended');
  if(h.m===1 && h.d===10) notes.push('Ashura: recommended, ideally with the 9th or 11th');
  if(h.m===1 && h.d===9) notes.push("Tasu'a: recommended alongside Ashura");
  if(h.m===1 && h.d!==9 && h.d!==10) notes.push('Muharram: the best month for voluntary fasting');
  if(h.d>=13 && h.d<=15 && !(h.m===12)) notes.push('White Day (13th–15th)');
  if(h.m===10 && h.d>=2) notes.push('Shawwal: six fasts recommended');
  if(w===1||w===4) notes.push(w===1?'Monday: Sunnah fast':'Thursday: Sunnah fast');
  if(f.doubtDay && h.m===8 && h.d===30) return {cls:'discouraged', reason:'Day of doubt (30 Sha’ban)', notes};
  if(f.shabanLate && h.m===8 && h.d>=16) return {cls:'discouraged', reason:'Second half of Sha’ban', notes};
  if(w===5) return {cls:'permissible', reason:'Friday: avoid as a lone fast', notes, friday:true};
  if(w===6 && f.saturdayAlone) return {cls:'permissible', reason:'Saturday: avoid as a lone fast', notes, saturday:true};
  return {cls:'permissible', reason:'', notes};
}
function patternFast(k){
  const f=S.settings.fasting; if(!f.enabled || !f.anchor || k < f.anchor) return false;
  return ((diffDays(f.anchor,k)%2)+2)%2===0;
}
function basePlan(k){

  if(c.cls==='obligatory') return f.ramadan ? {fast:true, why:'Ramadan: obligatory fast', c, pat, oblig:true} : {fast:pat, why:pat?'Alternating pattern':'Rest day in the pattern', c, pat};
  if(!f.enabled) return {fast:false, why:'Alternating fasting is paused', c, pat};
  const fridayFastOk = x => { const cc=classify(x); return cc.cls!=='prohibited'; };
  if(pat){
    if(c.cls==='discouraged') return {fast:false, why:`${c.reason}: skipped`, c, pat};
    if(w===5){
      if(f.friday==='allow') return {fast:true, why:'Friday kept as part of a regular pattern', c, pat};
      if(f.friday==='pair-thu') return {fast:true, why:'Friday paired with Thursday', c, pat};
      if(f.friday==='pair-sat') return {fast:true, why:'Friday paired with Saturday', c, pat};
      if(f.friday==='move-thu') return {fast:false, why:'Friday fast moved to Thursday', c, pat};
      return {fast:false, why:'Friday would be a lone fast: skipped', c, pat};
    }
    if(w===6 && f.saturdayAlone && !(f.friday==='pair-sat')) return {fast:false, why:'Saturday would be a lone fast: skipped', c, pat};
    return {fast:true, why:'Alternating pattern', c, pat};

  if(w===6 && f.friday==='pair-sat' && patternFast(addDays(k,-1)) && fridayFastOk(addDays(k,-1)) && classify(addDays(k,-1)).cls!=='obligatory' && c.cls!=='discouraged')

}

/* The day drawn as an arc from Fajr (left horizon) to Isha (right horizon). */
function skyArc(k, pt, p, np, isT){

  const W=720, H=300, cx=360, cy=262, r=228, span=Math.max(1, pt.isha-pt.fajr), now=nowMin();
  const pos=m=>{ let f=(m-pt.fajr)/span; f=Math.max(-.075,Math.min(1.075,f)); const a=Math.PI*(1-f); return [cx+r*Math.cos(a), cy-r*Math.sin(a), f]; };
  U.arcPos = pos;
  const P=(x,y)=>`${x.toFixed(1)},${y.toFixed(1)}`;
  const arc=(a,b)=>{ const [x1,y1]=pos(a),[x2,y2]=pos(b); return `M${P(x1,y1)} A${r},${r} 0 0 1 ${P(x2,y2)}`; };
  let s=`<svg class="sky-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Today's prayer times on an arc from Fajr to Isha">
  <defs><filter id="sunglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="skyfill" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="var(--accent)" stop-opacity=".16"/><stop offset=".55" stop-color="var(--gold)" stop-opacity=".05"/><stop offset="1" stop-color="var(--bg)" stop-opacity="0"/></radialGradient></defs>
  <path d="${arc(pt.fajr, pt.isha)} L${P(cx-r,cy)}Z" fill="url(#skyfill)"/>
  <line class="horizon" x1="40" x2="${W-40}" y1="${cy}" y2="${cy}"/>
  <path class="base" d="${arc(pt.fajr, pt.isha)}"/>`;
  if(p.fast){ s+=`<path class="fastwin" d="${arc(pt.fajr, pt.maghrib)}"/>`; if(isT && now>pt.fajr) s+=`<path class="fastdone" d="${arc(pt.fajr, Math.min(now, pt.maghrib))}"/>`; }
  else if(isT && now>pt.fajr){ s+=`<path class="daydone" d="${arc(pt.fajr, Math.min(now, pt.isha))}"/>`; }
  const [sx,sy,sf]=pos(pt.sunrise); { const a=Math.PI*(1-sf); const lx=cx+(r+24)*Math.cos(a), ly=cy-(r+24)*Math.sin(a); s+=`<line class="sunrise" x1="${(cx+(r-7)*Math.cos(a)).toFixed(1)}" y1="${(cy-(r-7)*Math.sin(a)).toFixed(1)}" x2="${(cx+(r+7)*Math.cos(a)).toFixed(1)}" y2="${(cy-(r+7)*Math.sin(a)).toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" style="opacity:.65">Sunrise</text>`; }
  if(isT){
    const [nx,ny,nf]=pos(now);
    if(now>=pt.sunrise && now<=pt.maghrib) s+=`<circle class="sun" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="9" id="now-marker"/>`;
    else { const [mx,my]=[cx-0.42*r, cy-0.78*r]; s+=`<g class="moon" transform="translate(${(mx-10).toFixed(1)} ${(my-10).toFixed(1)})"><path d="M12.5 0a9 9 0 1 0 7.5 15.5A7.5 7.5 0 0 1 12.5 0z" transform="scale(.9)"/></g>`; if(now>=pt.fajr && now<=pt.isha) s+=`<circle class="nowdot" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="4" id="now-marker"/>`; }
  }
  PRAYERS.forEach(([id,n])=>{ const [x,y,f]=pos(pt[id]); const on=day(k).h&&day(k).h[id]; const next=np&&np.id===id&&np.k===k; const a=Math.PI*(1-f); const lx=cx+(r+26)*Math.cos(a), ly=cy-(r+26)*Math.sin(a)+(f<.02||f>.98?-10:4);
    s+=`<g class="node ${on?'on':''} ${next?'next':''} ${U.justId===id?'just':''}" data-act="toggleH" data-id="${id}" tabindex="0" role="button" aria-pressed="${!!on}" aria-label="${n} ${fmtMin(pt[id])}">${next?`<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/>`:''}<circle class="o" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${n}</text></g>`; });

}

/* ============================== VIEW: habits ============================== */
function spark(h, n=28){
  let out='', k=addDays(todayKey(),-(n-1));
  for(let i=0;i<n;i++,k=addDays(k,1)){ const a=applicable(h,k); out+=`<i class="${!a?'na':isDone(h,k)?'on':''}" title="${k}"></i>`; }
  return `<div class="spark" aria-hidden="true">${out}</div>`;
}

      <label class="f">Group<select id="eh-group" ${h.fixed?'disabled':''}>${Object.entries(GROUPS).filter(([g])=>g!=='prayer'||h.fixed).map(([g,n])=>`<option value="${g}" ${h.group===g?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f">Frequency<select id="eh-freq">${[['daily','Every day'],['days','Specific weekdays'],['fast','Fasting days only'],['nonfast','Non-fasting days only']].map(([v,n])=>`<option value="${v}" ${f.type===v?'selected':''}>${n}</option>`).join('')}</select></label>

    ${h.fixed?'':`<div class="toggle" style="border:0;padding:0"><div class="tx">Private<small>Hide the name when privacy mode is on.</small></div><button class="sw" role="switch" id="eh-sens" aria-checked="${!!h.sensitive}" data-act="ehSens" aria-label="Private"></button></div>`}
    <div class="row between">

function heatmap(filter, weeks=20){
  const t=todayKey(); let start=addDays(t,-(weeks*7-1)); start=addDays(start,-dowK(start));
  let out=''; for(let k=start; k<=addDays(t, 6-dowK(t)); k=addDays(k,1)){
    if(k>t){ out+='<i class="fut"></i>'; continue; }
    const s=dayScore(k, filter); const l = !isFinite(s.pct)?0: s.pct===0?0: s.pct<.34?1: s.pct<.67?2: s.pct<1?3:4;
    out+=`<i data-l="${l}" title="${k}: ${s.done}/${s.total}"></i>`;
  }
  return `<div class="hm" role="img" aria-label="Completion heatmap, 20 weeks">${out}</div>`;
}

          return `<div class="hrow">
            <div style="min-width:0"><div class="nm">${esc(hName(h))}</div><div class="sub">${esc(freqTxt(h.freq))} · streak ${habitStreak(h)} · best ${habitBest(h)}</div>${spark(h)}</div>

            </div>
          </div>${U.editH===h.id?editHabitPanel(h):''}`; }).join('')}`; }).join('')}
      ${U.editH==='__new'?editHabitPanel({id:'__new',name:'',group:'custom',freq:{type:'daily',days:[]}}):''}
    </div>

function vRestraint(){
  const p=pmoInfo(), t=todayKey(), M=t.slice(0,7), nd=new Date(Date.UTC(+M.slice(0,4), +M.slice(5), 0)).getUTCDate();
  const next=MILESTONES.find(m=>m>p.cur);
  const size=260, cx=130, cy=130, R=126, len=14; let ticks='';
  for(let d=1; d<=nd; d++){ const k=`${M}-${pad(d)}`; const a=(-90+(d-1)*360/nd)*Math.PI/180; const cls = k>t||k<p.start ? 'fut' : p.resets.includes(k) ? 'reset' : 'on';
    ticks+=`<line x1="${(cx+(R-len)*Math.cos(a)).toFixed(1)}" y1="${(cy+(R-len)*Math.sin(a)).toFixed(1)}" x2="${(cx+R*Math.cos(a)).toFixed(1)}" y2="${(cy+R*Math.sin(a)).toFixed(1)}" class="${cls}"><title>${k}</title></line>`; }
  const v = U.reveal ? '' : 'veil';
  return `
  <div class="sec-head rise"><div><div class="eyebrow">Private</div><h2 class="display" style="font-size:clamp(36px,5vw,54px)">Restraint</h2><p class="muted" style="margin:10px 0 0;max-width:50ch">Visible only to you. Numbers stay veiled until you choose to show them.</p></div>
    <button class="btn" data-act="reveal">${ic('eye')}${U.reveal?'Hide numbers':'Show numbers'}</button></div>
  <section class="rs-hero rise" style="--d:80ms">
    <div class="rs-dial ${v}" aria-hidden="${!U.reveal}"><svg viewBox="0 0 ${size} ${size}">${ticks}</svg><div class="lbl"><b>${p.cur}</b><span>days</span></div></div>
    <div>
      <div class="eyebrow">${MON[+M.slice(5)-1]} · each tick is a day</div>
      <div class="bigstats ${v}" style="margin-top:14px" aria-hidden="${!U.reveal}"><div class="bigstat gold"><b>${p.best}</b><span>longest</span></div><div class="bigstat"><b>${p.clean90}</b><span>clean of last 90</span></div><div class="bigstat"><b>${p.resets.length}</b><span>resets</span></div></div>
      <div class="muted ${v}" style="margin-top:18px">${next?`${next-p.cur} ${next-p.cur===1?'day':'days'} to the ${next}-day station.`:'Past every station. Keep going.'}</div>
      <div class="stations ${v}" aria-hidden="${!U.reveal}">${MILESTONES.map(m=>`<div class="station ${p.cur>=m?'got':m===next?'next':''}"><i></i><span>${m}d</span></div>`).join('')}</div>
    </div>
  </section>
  <section class="rise" style="--d:140ms;max-width:640px">
    <div class="sec-head"><div><div class="eyebrow">Record</div><h2>Reset and history</h2></div></div>
    <div class="prose"><p>A reset marks one day. Every clean day before it still counts in your record. Make tawbah, note what led to it, and start the next streak today.</p></div>
    <div class="row" style="margin-top:16px">
      ${U.confirm==='pmoReset' ? `<span class="muted">Record a reset for today and start a new streak?</span><button class="btn sm danger solid" data-act="pmoReset">Confirm reset</button><button class="btn sm ghost" data-act="confirm" data-v="">Cancel</button>` : `<button class="btn danger" data-act="confirm" data-v="pmoReset">Reset streak</button>`}
      ${p.resets.length? (U.confirm==='pmoUndo' ? `<button class="btn sm pri" data-act="pmoUndo">Remove the ${esc(fmtG(p.resets[p.resets.length-1],{day:'numeric',month:'short'}))} reset</button><button class="btn sm ghost" data-act="confirm" data-v="">Cancel</button>` : `<button class="btn ghost" data-act="confirm" data-v="pmoUndo">Undo last reset</button>`) : ''}
    </div>
    <div class="fgrid" style="margin-top:20px;max-width:300px"><label class="f">Counting since<input type="date" id="pmo-start" value="${esc(p.start)}" max="${t}" data-chg="pmo.start"></label></div>

function tlTime(it, k){ if(it.anchor==='fixed') return parseHM(it.time); const pt=prayerTimes(k); if(!pt) return parseHM(it.time||'12:00'); return pt[it.anchor] + (+it.off||0); }
function condOk(it,k){ const w=dowK(k), f=planQuick(k); return it.cond==='all'||!it.cond || (it.cond==='weekdays'&&w>=1&&w<=5) || (it.cond==='weekend'&&(w===0||w===6)) || (it.cond==='fast'&&f) || (it.cond==='nonfast'&&!f); }

/* ============================== charts ============================== */
let gradN=0;
function barChart(data, o={}){
  const W=520, H=o.h||170, pl=30, pb=22, pt=8, n=data.length, bw=(W-pl)/n;
  const max = o.pct ? 1 : Math.max(1, ...data.map(d=>Math.max(d.v, d.v2||0)));
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks = o.pct ? [0,.5,1] : [0, Math.round(max/2), max];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Bar chart')}">`;
  ticks.forEach(tk=>{ s+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y(tk)}" y2="${y(tk)}"/><text x="${pl-6}" y="${y(tk)+3}" text-anchor="end">${o.pct?Math.round(tk*100)+'%':tk}</text>`; });
  data.forEach((d,i)=>{
    const x=pl+i*bw;
    if(o.dual){ const w=bw*.3; s+=`<rect class="bp" x="${x+bw*.18}" y="${y(d.v2)}" width="${w}" height="${Math.max(0,H-pb-y(d.v2))}" rx="3"/><rect class="${o.gold?'bg':'ba'}" x="${x+bw*.18+w+3}" y="${y(d.v)}" width="${w}" height="${Math.max(0,H-pb-y(d.v))}" rx="3"/>`; }
    else { const w=Math.min(30,bw*.5); s+=`<rect class="${o.gold?'bg':'ba'}" opacity="${d.hi?1:.6}" x="${x+(bw-w)/2}" y="${y(d.v)}" width="${w}" height="${Math.max(0,H-pb-y(d.v))}" rx="4"/>`; }
    s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  return s+'</svg>';
}
function lineChart(data, o={}){
  const W=520, H=o.h||170, pl=34, pb=22, pt=10, n=data.length, id='g'+(++gradN);
  const x=i=>pl+(W-pl-10)*(n<=1?0:i/(n-1)), y=v=>pt+(H-pt-pb)*(1-v);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  [0,.5,1].forEach(tk=>{ s+=`<line class="gl" x1="${pl}" x2="${W-10}" y1="${y(tk)}" y2="${y(tk)}"/><text x="${pl-6}" y="${y(tk)+3}" text-anchor="end">${Math.round(tk*100)}%</text>`; });
  const vals=data.map(d=>isFinite(d.v)?d.v:null);
  const pts=data.map((d,i)=>[x(i), y(vals[i]??0)]);
  const first=vals.findIndex(v=>v!==null);
  if(first>=0){ const seg=pts.slice(first); s+=`<path class="ar" fill="url(#${id})" d="M${seg[0][0]},${y(0)} ${seg.map(p=>'L'+p.join(',')).join(' ')} L${seg[seg.length-1][0]},${y(0)}Z"/><path class="ln" d="${seg.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ')}"/>`; const e=seg[seg.length-1]; s+=`<circle class="pt" cx="${e[0]}" cy="${e[1]}" r="4.5"/>`; }
  data.forEach((d,i)=>{ if((n-1-i)%Math.ceil(n/6)===0) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(d.l)}</text>`; });
  return s+'</svg>';
}

function rangeScore(from,to,filter){ let d=0,t=0; for(let k=from;k<=to;k=addDays(k,1)){ const s=dayScore(k,filter); d+=s.done; t+=s.total; } return t?d/t:NaN; }
function vInsights(){

  const cmp=(label,f)=>{ const tw=rangeScore(wk0,t,f), lw=rangeScore(addDays(wk0,-7),addDays(wk0,-1),f), tm=rangeScore(t.slice(0,8)+'01',t,f); const pm0=d2k(new Date(Date.UTC(+t.slice(0,4), +t.slice(5,7)-2, 1))), pmE=addDays(t.slice(0,8)+'01',-1); const pm=rangeScore(pm0,pmE,f); const dl=isFinite(tw)&&isFinite(lw)?Math.round((tw-lw)*100):null; return `<div>${label}</div><div class="num">${pctTxt(tw)}</div><div class="num ${dl==null?'faint':dl>=0?'delta up':'delta dn'}">${dl==null?'–':(dl>=0?'+':'')+dl}</div><div class="num muted">${pctTxt(tm)} <span class="faint">vs ${pctTxt(pm)}</span></div>`; };

  <div class="bigstats rise" style="--d:60ms">
    <div class="bigstat"><b>${pctTxt(rangeScore(addDays(t,-29),t,h=>h.group==='prayer'))}</b><span>prayers · 30 days</span></div>

  ${daysIn<7?`<div class="note rise" style="--d:80ms;max-width:66ch">Charts fill in as the days accumulate. After a week the lines mean something; after a month they mean a lot.</div>`:''}
  <div class="ins-grid rise" style="--d:120ms">

function render(keepScroll){
  invalidate(); applyTheme(); renderNav();
  const v=document.getElementById('view'); const y=window.scrollY;

function setPath(obj, path, val){ const ps=path.split('.'); let o=obj; for(let i=0;i<ps.length-1;i++){ if(!o[ps[i]]) o[ps[i]]={}; o=o[ps[i]]; } o[ps[ps.length-1]]=val; }
function getPath(obj, path){ return path.split('.').reduce((o,p)=>o&&o[p], obj); }

  if(path==='lat' && Math.abs(v)>90 || path==='lng' && Math.abs(v)>180){ toast('That coordinate is out of range'); return; }
  if(path==='tz'){ try{ new Intl.DateTimeFormat('en',{timeZone:v}); }catch(err){ toast('Unknown time zone','Use a name like America/Halifax.'); el.value=S.settings.tz; return; } }
  if(path==='fasting.anchor' && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('Pick a date'); return; }

});

/* ============================== lock-screen artwork (procedural, no downloads) ============================== */
/* Every frame is a square master (side S = the display's long edge). The centre square (side m = short edge)
   is what both orientations show; artwork focal points sit in its upper-middle, the information band in its lower half. */
const Art = {
  seed:1, wide:false,
  rnd(){ this.seed=(this.seed*9301+49297)%233280; return this.seed/233280; },
  C:{ night:'#0a0e13', indigo:'#121a2e', deep:'#0e1626', gold:'#d5b46a', gold2:'#ecd49a', teal:'#58b79e', teal2:'#8fd9c4', rose:'#8a4a5a', amber:'#c8803a', ink:'#e9eeec', ink2:'#a9b7b2', ink3:'#6f7f7a' },
  gradient(x,S,stops){ const g=x.createLinearGradient(0,0,0,S); stops.forEach(([p,c])=>g.addColorStop(p,c)); x.fillStyle=g; x.fillRect(0,0,S,S); },
  glow(x,cx,cy,r,color,a){ const g=x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,color.replace(')',`,${a})`).replace('rgb(','rgba(')); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(cx-r,cy-r,2*r,2*r); },
  stars(x,S,n,alpha=1){ for(let i=0;i<n;i++){ const sx=this.rnd()*S, sy=this.rnd()*S*.62, r=this.rnd()*1.6*S/1000+0.4; x.fillStyle=`rgba(233,238,236,${(0.25+this.rnd()*.75)*alpha})`; x.beginPath(); x.arc(sx,sy,r,0,Math.PI*2); x.fill(); } },
  crescent(x,cx,cy,r,color){ const o=document.createElement('canvas'); o.width=o.height=Math.ceil(r*2.4); const g=o.getContext('2d'); const c=o.width/2; g.fillStyle=color; g.beginPath(); g.arc(c,c,r,0,Math.PI*2); g.fill(); g.globalCompositeOperation='destination-out'; g.beginPath(); g.arc(c+r*.42,c-r*.18,r*.86,0,Math.PI*2); g.fill(); x.drawImage(o,cx-c,cy-c); },
  girih(x,S,alpha,tile){ x.save(); x.globalAlpha=alpha; x.strokeStyle='#9ac8b8'; x.lineWidth=Math.max(1,S/1400); for(let yy=0;yy<S+tile;yy+=tile){ for(let xx=0;xx<S+tile;xx+=tile){ x.save(); x.translate(xx,yy); x.strokeRect(-tile*.25,-tile*.25,tile*.5,tile*.5); x.rotate(Math.PI/4); x.strokeRect(-tile*.25,-tile*.25,tile*.5,tile*.5); x.restore(); } } x.restore(); },
  star8(x,cx,cy,r,ri,fill,stroke){ x.beginPath(); for(let i=0;i<16;i++){ const a=(i*22.5-90)*Math.PI/180, rr=i%2?ri:r; x[i?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a)); } x.closePath(); if(fill){ x.fillStyle=fill; x.fill(); } if(stroke){ x.strokeStyle=stroke; x.stroke(); } },
  /* pointed (ogee-ish) arch path from base (bx,by) with width w and height h */
  arch(x,bx,by,w,h){ const l=bx-w/2, r=bx+w/2, sh=by-h*.6; x.beginPath(); x.moveTo(l,by); x.lineTo(l,sh); x.bezierCurveTo(l,sh-h*.28,bx-w*.18,by-h,bx,by-h); x.bezierCurveTo(bx+w*.18,by-h,r,sh-h*.28,r,sh); x.lineTo(r,by); x.closePath(); },
  dome(x,cx,by,r,fill){ x.fillStyle=fill; x.beginPath(); x.moveTo(cx-r,by); x.bezierCurveTo(cx-r,by-r*1.05,cx-r*.35,by-r*1.55,cx,by-r*1.62); x.bezierCurveTo(cx+r*.35,by-r*1.55,cx+r,by-r*1.05,cx+r,by); x.closePath(); x.fill(); x.fillRect(cx-r*.03,by-r*1.9,r*.06,r*.3); this.crescent(x,cx,by-r*2.02,r*.11,fill); },
  minaret(x,cx,by,h,w,fill){ x.fillStyle=fill; x.fillRect(cx-w/2,by-h,w,h); x.fillRect(cx-w*.8,by-h*.78,w*1.6,w*.5); x.fillRect(cx-w*.8,by-h*.5,w*1.6,w*.5); x.beginPath(); x.moveTo(cx-w*.7,by-h); x.lineTo(cx,by-h-w*2.2); x.lineTo(cx+w*.7,by-h); x.closePath(); x.fill(); },
  mosque(x,cx,by,s,fill,lit){ // s = overall width
    const w=s; const H=s*.34;
    x.fillStyle=fill; x.fillRect(cx-w*.5,by-H,w,H);
    this.dome(x,cx,by-H,s*.17,fill); this.dome(x,cx-w*.33,by-H,s*.085,fill); this.dome(x,cx+w*.33,by-H,s*.085,fill);
    this.minaret(x,cx-w*.5-s*.03,by,s*.7,s*.035,fill); this.minaret(x,cx+w*.5+s*.03,by,s*.7,s*.035,fill);
    for(let i=-2;i<=2;i++){ x.fillStyle=lit; this.arch(x,cx+i*w*.19,by-H*.12,w*.07,H*.5); x.fill(); }
    x.fillStyle=fill; x.fillRect(cx-w*.52,by-H*.06,w*1.04,H*.06);
  },
  kaaba(x,cx,by,s){ // cube with kiswa band and door, light from the left
    const w=s, h=s*.86, d=s*.46; const fx=cx-w*.42;
    x.fillStyle='#0b0b0e'; x.fillRect(fx,by-h,w*.84,h);                       // front
    x.fillStyle='#17171c'; x.beginPath(); x.moveTo(fx+w*.84,by-h); x.lineTo(fx+w*.84+d*.5,by-h-d*.26); x.lineTo(fx+w*.84+d*.5,by-d*.26); x.lineTo(fx+w*.84,by); x.closePath(); x.fill(); // side
    x.fillStyle='#1f1f26'; x.beginPath(); x.moveTo(fx,by-h); x.lineTo(fx+d*.5,by-h-d*.26); x.lineTo(fx+w*.84+d*.5,by-h-d*.26); x.lineTo(fx+w*.84,by-h); x.closePath(); x.fill(); // top

    x.fillStyle='#0b0b0e'; for(let i=0;i<9;i++){ x.fillRect(fx+w*.04+i*w*.09,bandY+bandH*.3,w*.05,bandH*.4); }  // calligraphy band suggestion
    x.fillStyle=this.C.gold; x.fillRect(fx+w*.56,by-h*.52,w*.16,h*.34);         // door
    x.fillStyle='#0b0b0e'; x.fillRect(fx+w*.585,by-h*.49,w*.11,h*.29);
    x.fillStyle=this.C.gold2; x.fillRect(fx+w*.6,by-h*.48,w*.08,h*.02);
    x.fillStyle='rgba(213,180,106,.18)'; x.beginPath(); x.ellipse(cx,by+s*.04,s*.9,s*.08,0,0,Math.PI*2); x.fill();   // ground glow
  },
  lamp(x,cx,top,s){ x.strokeStyle=this.C.gold; x.lineWidth=s*.02; x.beginPath(); x.moveTo(cx,top); x.lineTo(cx,top+s*.5); x.stroke(); x.fillStyle=this.C.gold; x.beginPath(); x.moveTo(cx,top+s*.5); x.bezierCurveTo(cx+s*.3,top+s*.6,cx+s*.3,top+s*1.1,cx,top+s*1.3); x.bezierCurveTo(cx-s*.3,top+s*1.1,cx-s*.3,top+s*.6,cx,top+s*.5); x.fill(); this.glow(x,cx,top+s*.95,s*1.6,'rgb(236,212,154)',.35); },
  calligraphy(x,text,cx,cy,size,color){ x.save(); x.font=`400 ${size}px Amiri, "Scheherazade New", serif`; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl'; x.shadowColor='rgba(213,180,106,.35)'; x.shadowBlur=size*.35; x.fillStyle=color; x.fillText(text,cx,cy); x.restore(); },

  /* ---- scenes: (x, S, m, day) ---- */
  scenes:{
    dawnMosque(A,x,S,m){ A.gradient(x,S,[[0,'#0a0e13'],[.22,'#141c33'],[.36,'#3a3450'],[.44,'#8a5a4a'],[.49,'#d9a05a'],[.52,'#0d1118'],[1,'#0a0e13']]); A.stars(x,S,90,.6); A.glow(x,S*.5,S*.5,S*.45,'rgb(217,160,90)',.25); A.crescent(x,S*.3,S*.31,S*.035,A.C.gold2); A.mosque(x,S*.5,S*.505,m*.56,'#0a0d12','rgba(236,212,154,.75)'); },
    dawnWord(A,x,S,m){ A.gradient(x,S,[[0,'#0a0e13'],[.3,'#15213a'],[.44,'#5b3d4a'],[.5,'#c48a4f'],[.53,'#0a0e13'],[1,'#0a0e13']]); A.stars(x,S,60,.5); A.girih(x,S,.05,S/7); { const sz=A.wide?S*.042:Math.min(m*.2,S*.085), cy=A.wide?S*.53:S*.36; A.calligraphy(x,'وَالْفَجْرِ',S*.5,cy,sz,A.C.gold2); if(!A.wide){ x.fillStyle=A.C.ink3; x.font=`600 ${m*.018}px Manrope, sans-serif`; x.textAlign='center'; x.fillText('“BY THE DAWN”  ·  AL-FAJR 89:1',S*.5,cy+sz*.78); } } },

  pick(moment, fast, dayN){

/* ============================== the living sky ==============================
   A canvas that paints the real sky over the prayer day: colour keyed to this minute
   (pre-dawn, dawn, day, afternoon, sunset, dusk, night), the sun or the moon at its place
   on the dome, the moon with its true phase, stars after dark. Same dome geometry as the
   SVG arc (720×300, centre 360,262, radius 228) so the markers line up. */
const Moon = {
  SYNODIC: 29.530588853,
  /* phase 0 = new, .5 = full; from the new moon of 2000-01-06 18:14 UTC */
  phase(d){ const days=(d.getTime()-947182440000)/86400000; const p=(days/this.SYNODIC)%1; return p<0?p+1:p; },
  illum(p){ return (1-Math.cos(2*Math.PI*p))/2; },
  name(p){ const i=Math.round(p*8)%8; return ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'][i]; },
  /* draws the moon with its terminator; waxing lights the right side (northern sky) */
  draw(x,cx,cy,R,p,lit='#ecd49a',dark='#0b1017'){
    x.save(); x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.clip();
    x.fillStyle=lit; x.fillRect(cx-R,cy-R,2*R,2*R);
    const waxing=p<.5, k=Math.abs(Math.cos(2*Math.PI*p));
    const crescent = p<.25 || p>.75;
    x.fillStyle=dark;
    // the unlit half
    x.beginPath(); x.rect(waxing?cx-R:cx, cy-R, R, 2*R); x.fill();
    // the terminator ellipse: dark when crescent, lit when gibbous
    x.fillStyle=crescent?dark:lit;
    x.beginPath(); x.ellipse(cx,cy,Math.max(.01,R*k),R,0,0,Math.PI*2); x.fill();
    // maria + limb shading
    x.globalAlpha=.16; x.fillStyle='#6f7f7a';
    [[-.3,-.25,.28],[.15,.1,.2],[-.05,.35,.16],[.3,-.4,.12]].forEach(([ox,oy,r])=>{ x.beginPath(); x.arc(cx+ox*R,cy+oy*R,r*R,0,Math.PI*2); x.fill(); });
    x.globalAlpha=1;
    const g=x.createRadialGradient(cx-R*.3,cy-R*.3,R*.2,cx,cy,R); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.28)'); x.fillStyle=g; x.fillRect(cx-R,cy-R,2*R,2*R);
    x.restore();
  }
};

const Sky = {
  W:720, H:300, cx:360, cy:262, r:228,
  /* palettes: [top, upper, horizon, glow colour, glow alpha, star alpha, ground] */
  P:{
    night:    ['#05070c','#0b1020','#141b2e','#ecd49a',0,   1,  '#0a0d14'],
    predawn:  ['#070a14','#131a30','#3a3450','#8a5a4a',.22, .6, '#0b0e16'],
    dawn:     ['#0c1224','#3a3450','#d9a05a','#d9a05a',.5,  .12,'#13110f'],
    morning:  ['#0f2630','#1b4350','#8fb7a8','#ecd49a',.4,  0,  '#101a1c'],
    day:      ['#123039','#1f5260','#a9c7bc','#ecd49a',.32, 0,  '#111c1e'],
    afternoon:['#152c33','#3f5a52','#c9a86a','#ecd49a',.38, 0,  '#151a16'],
    sunset:   ['#141630','#5a2e48','#e0a052','#e0a052',.55, 0,  '#1a1216'],
    dusk:     ['#0a0e1c','#2a1a3a','#7a3a4a','#d98a4a',.3,  .35,'#0f0d14'],
    evening:  ['#06090f','#0d1322','#1a2444','#ecd49a',0,   .8, '#0a0d14'],
  },
  hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; },
  rgbHex(s){ const m=s.match(/\d+/g)||[0,0,0]; return '#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''); },
  mix(a,b,t){ const A=this.hex(a),B=this.hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; },
  /* where in the day we are, as a blend of two palettes */
  blend(pt,min){
    const K=[[pt.fajr-90,'night'],[pt.fajr-25,'predawn'],[pt.sunrise-8,'dawn'],[pt.sunrise+70,'morning'],[pt.dhuhr,'day'],[pt.asr+20,'afternoon'],[pt.maghrib-8,'sunset'],[pt.maghrib+45,'dusk'],[pt.isha+50,'evening'],[pt.isha+140,'night']];
    if(min<=K[0][0]) return ['night','night',0];
    for(let i=0;i<K.length-1;i++){ if(min>=K[i][0] && min<K[i+1][0]){ const t=(min-K[i][0])/Math.max(1,K[i+1][0]-K[i][0]); return [K[i][1],K[i+1][1],t]; } }
    return ['night','night',0];
  },
  palette(pt,min){
    const [a,b,t]=this.blend(pt,min), A=this.P[a], B=this.P[b];
    const col=i=>this.mix(A[i],B[i],t), num=i=>A[i]+(B[i]-A[i])*t;
    return {top:col(0), upper:col(1), horizon:col(2), glow:this.hex(A[3]).map((v,i)=>Math.round(v+(this.hex(B[3])[i]-v)*t)), glowA:num(4), stars:num(5), ground:col(6), name:t<.5?a:b};
  },
  pos(pt,m){ const span=Math.max(1,pt.isha-pt.fajr); let f=(m-pt.fajr)/span; f=Math.max(-.075,Math.min(1.075,f)); const a=Math.PI*(1-f); return [this.cx+this.r*Math.cos(a), this.cy-this.r*Math.sin(a), f]; },
  /* the moon travels the same dome between maghrib and the next fajr */
  moonPos(pt,min){ const night=(pt.fajr+1440)-pt.maghrib; let m=min; if(m<pt.fajr) m+=1440; let f=(m-pt.maghrib)/night; if(f<0||f>1) return null; const a=Math.PI*(1-f); return [this.cx+this.r*Math.cos(a), this.cy-this.r*Math.sin(a)]; },
  seedFor(k){ let s=0; for(const ch of k) s=(s*31+ch.charCodeAt(0))%233280; return s+7; },
  draw(c, k, pt, min, opts={}){
    if(!c||!pt) return;
    const dpr=Math.min(2,window.devicePixelRatio||1), cw=c.clientWidth||this.W, ch=c.clientHeight||this.H;
    if(!cw||!ch) return;
    if(c.width!==Math.round(cw*dpr)||c.height!==Math.round(ch*dpr)){ c.width=Math.round(cw*dpr); c.height=Math.round(ch*dpr); }
    const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,cw,ch);
    const pal=this.palette(pt,min), full=!!opts.full, skyOnly=!!opts.skyOnly, domeOnly=!!opts.domeOnly;
    /* geometry: the dome box is where the SVG arc sits inside the canvas (or the whole canvas) */
    const box=opts.box||{x:0,y:0,w:cw,h:ch};
    const sx=box.w/this.W, sy=box.h/this.H, hy=skyOnly? ch*.74 : box.y+this.cy*sy;
    const P=(u,v)=>[box.x+u*sx, box.y+v*sy];
    if(!domeOnly){
    /* sky */
    const horizon = full ? this.mix(pal.horizon.startsWith('rgb')?this.rgbHex(pal.horizon):pal.horizon, pal.upper.startsWith('rgb')?this.rgbHex(pal.upper):pal.upper, .45) : pal.horizon;
    const g=x.createLinearGradient(0,0,0,hy*1.02); g.addColorStop(0,pal.top); g.addColorStop(.58,pal.upper); g.addColorStop(1,horizon); x.fillStyle=g; x.fillRect(0,0,cw,hy*1.02);
    /* ground */
    if(skyOnly){ const gg=x.createLinearGradient(0,hy*.9,0,ch); gg.addColorStop(0,'rgba(0,0,0,0)'); gg.addColorStop(1,opts.bg||'#0a0e13'); x.fillStyle=gg; x.fillRect(0,hy*.9,cw,ch-hy*.9); }
    else { const gg=x.createLinearGradient(0,hy,0,ch); gg.addColorStop(0,pal.ground); gg.addColorStop(1,opts.bg||'#0a0e13'); x.fillStyle=gg; x.fillRect(0,hy,cw,ch-hy); }
    /* stars (seeded per date; twinkle with the minute) */
    if(pal.stars>0){ Art.seed=this.seedFor(k); const n=full?220:120, tw=(Date.now()/60000)%1000; for(let i=0;i<n;i++){ const px=Art.rnd()*cw, py=Art.rnd()*hy*.9, rr=Art.rnd()*1.3+.35, ph=Art.rnd()*6.28, base=.25+Art.rnd()*.7; const a=base*(0.7+0.3*Math.sin(tw*1.7+ph))*pal.stars*(py/hy<.85?1:.5); x.fillStyle=`rgba(236,240,238,${a.toFixed(3)})`; x.beginPath(); x.arc(px,py,rr,0,Math.PI*2); x.fill(); } }
    }
    /* sun */
    const dayTime = min>=pt.sunrise-20 && min<=pt.maghrib+10;
    if(!skyOnly){
    if(dayTime && pal.glowA>0){ const [ux,uy]=this.pos(pt,min); const [X,Y]=P(ux,uy); const gl=`rgb(${pal.glow.join(',')})`;
      Art.glow(x,X,Y,Math.max(box.w,box.h)*.5,gl,pal.glowA*.5); Art.glow(x,X,Y,Math.min(box.w,box.h)*.26,gl,pal.glowA);
      x.fillStyle=`rgba(${pal.glow.join(',')},.55)`; x.beginPath(); x.arc(X,Y,Math.max(9,box.w*.022),0,Math.PI*2); x.fill(); }
    else if(pal.glowA>0){ /* dawn or dusk: the glow sits on the horizon where the sun is */
      const m=min<pt.dhuhr?pt.sunrise:pt.maghrib; const [ux]=this.pos(pt,m); const [X]=P(ux,0); Art.glow(x,X,hy,box.w*.6,`rgb(${pal.glow.join(',')})`,pal.glowA*.7); }
    /* moon */
    if(pal.stars>.2){ const mp=this.moonPos(pt,min); if(mp){ const p=Moon.phase(new Date()); const R=Math.max(10,box.w*.027); const [X,Y]=P(mp[0],mp[1]); Art.glow(x,X,Y,R*8,'rgb(236,212,154)',.16*pal.stars); Moon.draw(x,X,Y,R,p); } }
    /* hour ticks engraved just inside the dome: the instrument's rim */
    if(opts.box){ x.save(); x.strokeStyle=`rgba(236,212,154,${full?.35:.45})`; x.lineWidth=1; const R=this.r*sx, [CX,CY]=P(this.cx,this.cy);
      for(let h=Math.ceil(pt.fajr/60); h*60<=pt.isha; h++){ const [,,f]=this.pos(pt,h*60); if(f<0||f>1) continue; const a=Math.PI*(1-f); const big=h%3===0; const r1=R-(big?16:9)*Math.min(1,sx*1.4), r2=R-3;
        x.beginPath(); x.moveTo(CX+r1*Math.cos(a),CY-r1*Math.sin(a)*(sy/sx)); x.lineTo(CX+r2*Math.cos(a),CY-r2*Math.sin(a)*(sy/sx)); x.stroke();
        if(big){ x.fillStyle='rgba(236,212,154,.55)'; x.font=`500 ${Math.max(9,11*Math.min(1.4,sx*1.1))}px "Cormorant Garamond", serif`; x.textAlign='center'; x.textBaseline='middle'; const rt=R-28*Math.min(1.3,sx*1.2); x.fillText(String(h%12||12),CX+rt*Math.cos(a),CY-rt*Math.sin(a)*(sy/sx)); } }
      x.restore(); }
    }
    if(domeOnly){ c.dataset.pal=pal.name; return; }
    /* a breath of pattern in the upper sky, and a horizon haze */
    if(skyOnly && pal.glowA>0){ const m=min<pt.dhuhr?pt.sunrise:pt.maghrib; const [ux]=this.pos(pt,m); Art.glow(x,ux*(cw/this.W),hy,cw*.5,`rgb(${pal.glow.join(',')})`,pal.glowA*.5); }
    x.save(); x.beginPath(); x.rect(0,0,cw,hy); x.clip(); Art.girih(x,Math.max(cw,ch),full?.025:.03,full?190:160); x.restore();
    const hz=x.createLinearGradient(0,hy-ch*.12,0,hy); hz.addColorStop(0,'rgba(255,255,255,0)'); hz.addColorStop(1,`rgba(255,255,255,${((full?.03:.06)+pal.glowA*(full?.04:.08)).toFixed(3)})`); x.fillStyle=hz; x.fillRect(0,hy-ch*.12,cw,ch*.12);
    /* vignette into the plate */
    const bg=opts.bg||'#0a0e13', B=this.hex(bg);
    const v=x.createRadialGradient(cw/2,ch*.55,Math.min(cw,ch)*.35,cw/2,ch*.55,Math.max(cw,ch)*.78); v.addColorStop(0,`rgba(${B.join(',')},0)`); v.addColorStop(1,`rgba(${B.join(',')},${full?.55:.75})`); x.fillStyle=v; x.fillRect(0,0,cw,ch);
    const tp=x.createLinearGradient(0,0,0,ch*.22); tp.addColorStop(0,`rgba(${B.join(',')},${full?.5:.7})`); tp.addColorStop(1,`rgba(${B.join(',')},0)`); x.fillStyle=tp; x.fillRect(0,0,cw,ch*.22);
    c.dataset.pal=pal.name;
  },
  mount(){
    document.querySelectorAll('canvas.sky-live').forEach(c=>{
      const k=c.dataset.k||todayKey(); const pt=prayerTimes(k); if(!pt) return;
      const min = k===todayKey() ? nowMin()+new Date().getSeconds()/60 : 12*60;
      const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0a0e13';
      const skyOnly=c.classList.contains('board-sky'), domeOnly=c.classList.contains('dome-only');
      let box=null; const svg=!skyOnly && c.parentElement && c.parentElement.querySelector('.sky-svg');
      if(svg){ const cr=c.getBoundingClientRect(), sr=svg.getBoundingClientRect(); if(sr.width>10){ const hh=Math.min(sr.height, sr.width*this.H/this.W); box={x:sr.left-cr.left, y:sr.top-cr.top+(sr.height-hh), w:sr.width, h:hh}; } }
      this.draw(c,k,pt,min,{full:skyOnly||domeOnly, skyOnly, domeOnly, box, bg: bg.startsWith('#')&&bg.length===7?bg:'#0a0e13'});
      c._box = box ? box.x+','+box.y+','+box.w+','+box.h : (c.clientWidth+'x'+c.clientHeight);
    });
  },
  /* cheap once-a-second check: if the arc moved under the canvas (insets, bars, layout), redraw now */
  check(){
    for(const c of document.querySelectorAll('canvas.sky-live')){
      const svg=!c.classList.contains('board-sky') && c.parentElement && c.parentElement.querySelector('.sky-svg'); let key;
      if(svg){ const cr=c.getBoundingClientRect(), sr=svg.getBoundingClientRect(); if(sr.width>10){ const hh=Math.min(sr.height, sr.width*this.H/this.W); key=(sr.left-cr.left)+','+(sr.top-cr.top+(sr.height-hh))+','+sr.width+','+hh; } }
      if(!key) key=c.clientWidth+'x'+c.clientHeight;
      if(c._box!==undefined && c._box!==key){ skyLast=0; skyTick(); return; }
    }
  }
};
let skyLast=0;
function skyTick(){ const t=Date.now(); if(t-skyLast<30000) return; skyLast=t; Sky.mount(); }
window.addEventListener('resize', ()=>{ skyLast=0; skyTick(); });

/* the moon as an inline SVG-free plate: a small canvas plus caption */

/* ---------- defaults added by the app ---------- */
function appDefaults(d){
  d.settings.ptSource = 'mosque';
  d.settings.hijriOffset = 1;   // Masjid Dar As-Salam announces the month one day ahead of Umm al-Qura
  d.settings.alarms = { azan:{fajr:true,dhuhr:false,asr:false,maghrib:true,isha:true}, notify:{fajr:false,dhuhr:true,asr:true,maghrib:false,isha:false}, suhoor:'buzzer', iftar:'notify', prep:'notify', lead:0 };
  d.timeline.forEach(it=>{ it.alert = it.prayer ? 'auto' : (it.remind ? 'notify' : 'none'); });
  const sleep = d.timeline.find(x=>x.id==='sleep'); if(sleep) sleep.alert='notify';
  d.timeline.push({id:'screens', label:'Screens off', anchor:'fixed', off:0, time:'20:30', cond:'all', remind:true, alert:'buzzer', note:'Rule: no screens in the hour before bed'});

function migrate(){
  if(!S.settings.alarms) S.settings.alarms = appDefaults(DEF0()).settings.alarms;
  if(!S.settings.ptSource){ S.settings.ptSource='mosque'; S.settings.hijriOffset=1; }
  // builds before 0.6 saved 'calc' as the default; move those once to the masjid timetable
  if(!L.ptMigrated){ L.ptMigrated=true; saveL(); if(S.settings.ptSource==='calc'){ S.settings.ptSource='mosque'; if(!S.settings.hijriOffset) S.settings.hijriOffset=1; Store.mark('settings'); } }
  S.timeline.forEach(it=>{ if(it.alert===undefined) it.alert = it.prayer ? 'auto' : (it.remind ? 'notify' : 'none'); });
  if(!S.timeline.some(x=>x.id==='screens')) S.timeline.push({id:'screens', label:'Screens off', anchor:'fixed', off:0, time:'20:30', cond:'all', remind:true, alert:'buzzer', note:'Rule: no screens in the hour before bed'});
